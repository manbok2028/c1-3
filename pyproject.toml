[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codyssey-c1-3"
version = "0.1.0"
description = "Quality checks for the Codyssey no-code automation mission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "manbok2028" }]
dependencies = []

[project.scripts]
codyssey-c1-3 = "codyssey_c1_3.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
